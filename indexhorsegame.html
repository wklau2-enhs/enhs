    <!-- Google Fonts for friendly rounded typography -->
    <link href="https://fonts.googleapis.com/css2?family=Mochiyom+One&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .font-rounded {
            font-family: 'Mochiyom One', 'Noto Sans TC', cursive;
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(245, 158, 11, 0.6); }
            50% { transform: scale(1.04); box-shadow: 0 0 42px rgba(245, 158, 11, 0.95); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 1.8s infinite ease-in-out;
        }
        @keyframes horse-bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-14px) rotate(3deg); }
        }
        .animate-horse-happy {
            animation: horse-bounce 0.55s infinite ease-in-out;
        }
        @keyframes eat-chew {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08) rotate(-3deg); }
        }
        .animate-eating {
            animation: eat-chew 0.22s infinite ease-in-out;
        }
        .switch-pressed {
            transform: translateY(8px) scale(0.96) !important;
            box-shadow: 0 2px 0 #b45309 !important;
        }
        .mud-spot {
            transition: all 0.4s ease-out;

</head>

    <script>
        // Global Game State
        let currentMode = 'game';
        let currentStep = 1;
        let stepSubCount = 0;
        let maxPresses = 5;
        let isProcessingAction = false;
        let isVoiceEnabled = true;
        let speechLang = 'zh-HK';
        let audioCtx = null;

        // Lazy Initializer for Web Audio API
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Web Audio API Sound Synthesizer
        const SoundFX = {
            // 1. Realistic Carrot Chop & Chewing/Crunching Sound
            playCrunch: () => {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                [0, 0.12].forEach((offset) => {
                    const bufferSize = ctx.sampleRate * 0.08;
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let j = 0; j < bufferSize; j++) {
                        data[j] = (Math.random() * 2 - 1) * Math.exp(-j / (bufferSize * 0.3));
                    }
                    const noise = ctx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(1200 + Math.random() * 400, now + offset);
                    filter.Q.value = 3;

                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0.5, now + offset);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.08);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);
                    noise.start(now + offset);
                });
            },

            // 2. Wash & Wipe Sponge Water Scrubbing Sound
            playWater: () => {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const bufferSize = ctx.sampleRate * 0.5;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(400, now);
                filter.frequency.linearRampToValueAtTime(1800, now + 0.2);
                filter.frequency.linearRampToValueAtTime(300, now + 0.5);

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                noise.start(now);
            },

            // 3. Realistic Horse Whinny & Neighing Call
            playNeigh: () => {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';

                osc.frequency.setValueAtTime(380, now);
                osc.frequency.exponentialRampToValueAtTime(820, now + 0.2);
                osc.frequency.setValueAtTime(820, now + 0.35);
                osc.frequency.exponentialRampToValueAtTime(350, now + 0.65);

                const lfo = ctx.createOscillator();
                lfo.frequency.setValueAtTime(16, now);
                const lfoGain = ctx.createGain();
                lfoGain.gain.setValueAtTime(55, now);
                lfo.connect(osc.frequency);
                lfo.start(now);
                lfo.stop(now + 0.65);

                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.65);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.65);
            },

            // 4. Brush Grooming Sound
            playBrush: () => {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const bufferSize = ctx.sampleRate * 0.25;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = ctx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.setValueAtTime(2500, now);

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                noise.start(now);
            },

            // 5. Broom Sweeping Barn Sound
            playSweep: () => {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const bufferSize = ctx.sampleRate * 0.32;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1500, now);
                filter.frequency.linearRampToValueAtTime(600, now + 0.3);

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.32);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                noise.start(now);
            },

            // 6. Fanfare Cheering & Applause Sound
            playCheer: () => {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                    gain.gain.setValueAtTime(0.3, now + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + idx * 0.1);
                    osc.stop(now + idx * 0.1 + 0.4);
                });
            }
        };

        // Text-to-Speech Voice Guidance Helper
        function speakPrompt(text) {
            if (!isVoiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = speechLang;
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        function toggleVoiceHelp() {
            isVoiceEnabled = !isVoiceEnabled;
            const statusLabel = document.getElementById('voice-status');
            statusLabel.innerText = isVoiceEnabled ? '語音引導：開啟' : '語音引導：關閉';
            if (isVoiceEnabled) {
                speakPrompt("語音引導已開啟");
            }
        }

        function updateTargetPresses(val) {
            maxPresses = parseInt(val, 10) || 5;
            updatePressBadge();
        }

        function updatePressBadge() {
            document.getElementById('press-counter-badge').innerText = `進度: ${stepSubCount} / ${maxPresses} 🎯`;
        }

        // Central Switch Handler (Clicks & Keyboard)
        function handleSwitchPress() {
            if (isProcessingAction) return;

            // Visual Switch Press Effect
            const switchBtn = document.getElementById('main-switch-btn');
            switchBtn.classList.add('switch-pressed');
            setTimeout(() => switchBtn.classList.remove('switch-pressed'), 200);

            if (currentMode === 'game') {
                executeGameSubStep();
            }
        }

        // Global Keyboard Switch Integration (Space / Enter)
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                handleSwitchPress();
            }
        });

        // Step Mechanics Execution
        function executeGameSubStep() {
            isProcessingAction = true;
            stepSubCount++;
            updatePressBadge();

            const propIcon = document.getElementById('prop-icon');
            const horseSvg = document.getElementById('horse-svg');

            // STEP 1: CUT CARROT & FEED HAY
            if (currentStep === 1) {
                const troughContent = document.getElementById('trough-content');
                document.getElementById('trough-container').classList.remove('hidden');

                if (stepSubCount < maxPresses - 1) {
                    // Cutting Carrot Phase
                    propIcon.innerText = '🔪🥕';
                    propIcon.className = 'text-8xl transition-all duration-200 opacity-100 scale-125 translate-x-8 translate-y-4';
                    SoundFX.playCrunch();
                    speakPrompt("切紅蘿蔔！");

                    setTimeout(() => {
                        propIcon.className = 'text-8xl transition-all duration-200 opacity-0 scale-50';
                        isProcessingAction = false;
                    }, 600);
                } else if (stepSubCount === maxPresses - 1) {
                    // Putting Hay into Trough Phase
                    propIcon.innerText = '🌾';
                    propIcon.className = 'text-8xl transition-all duration-300 opacity-100 scale-125 translate-x-16 translate-y-12';
                    troughContent.className = 'text-3xl transition-transform duration-300 transform scale-100';
                    SoundFX.playCrunch();
                    speakPrompt("把乾草放進餵食槽！");

                    setTimeout(() => {
                        propIcon.className = 'text-8xl transition-all duration-200 opacity-0 scale-50';
                        isProcessingAction = false;
                    }, 700);
                } else {
                    // Step 1 Final Feeding
                    propIcon.innerText = '🥕🌾';
                    propIcon.className = 'text-8xl transition-all duration-300 opacity-100 scale-125 translate-x-16 translate-y-12';
                    SoundFX.playCrunch();
                    SoundFX.playNeigh();
                    speakPrompt("小馬吃了紅蘿蔔和乾草，吃得好開心！");

                    setTimeout(() => {
                        propIcon.className = 'text-8xl transition-all duration-200 opacity-0 scale-50';
                        advanceToStep(2, "小馬在泥巴裡翻滾，身上黏滿泥土，按【拍掣】幫牠刷洗乾淨！");
                    }, 1500);
                }

            // STEP 2: BRUSH MUD & WASH HORSE
            } else if (currentStep === 2) {
                document.getElementById('mud-overlay').classList.remove('hidden');

                // Clean mud spot on horse body on each press
                const mudSpot = document.getElementById(`mud-${stepSubCount}`);
                if (mudSpot) mudSpot.style.opacity = '0';

                if (stepSubCount <= 3) {
                    // Brushing Mud
                    propIcon.innerText = '🪮';
                    propIcon.className = 'text-8xl transition-all duration-200 opacity-100 scale-125 -translate-y-4';
                    SoundFX.playBrush();
                    speakPrompt(`刷乾淨馬身上的泥巴！`);

                    setTimeout(() => {
                        propIcon.className = 'text-8xl transition-all duration-200 opacity-0 scale-50';
                        isProcessingAction = false;
                    }, 600);

                } else if (stepSubCount < maxPresses) {
                    // Washing Water Splash
                    propIcon.innerText = '💦';
                    propIcon.className = 'text-8xl transition-all duration-300 opacity-100 scale-125 -translate-y-6';
                    SoundFX.playWater();
                    showBubbles();
                    speakPrompt("用清水幫小馬沖洗！");

                    setTimeout(() => {
                        propIcon.className = 'text-8xl transition-all duration-200 opacity-0 scale-50';
                        isProcessingAction = false;
                    }, 700);

                } else {
                    // Step 2 Final Completion
                    propIcon.innerText = '✨';
                    propIcon.className = 'text-8xl transition-all duration-300 opacity-100 scale-125';
                    SoundFX.playWater();
                    SoundFX.playNeigh();
                    showSparkles('✨', 8);
                    speakPrompt("哇！小馬洗得乾乾淨淨了！");

                    setTimeout(() => {
                        propIcon.className = 'text-8xl transition-all duration-200 opacity-0 scale-50';
                        document.getElementById('mud-overlay').classList.add('hidden');
                        advanceToStep(3, "地面有樹葉、乾草和便便，按【拍掣】把它們逐一掃乾淨！");
                    }, 1800);
                }

            // STEP 3: SWEEP BARN FLOOR (LEAVES, HAY, WOOD, POOP)
            } else if (currentStep === 3) {
                document.getElementById('barn-dirt-container').classList.remove('hidden');

                const dirtItem = document.getElementById(`dirt-${stepSubCount}`);
                const dirtNames = ["樹葉 🍂", "乾草 🌾", "樹葉 🍂", "木柴 🪵", "便便 💩"];
                const currentDirtName = dirtNames[stepSubCount - 1] || "垃圾";

                // Precise broom location relative to target dirt item (x-offsets for 5 items)
                const xPositions = [-140, -70, 0, 70, 140];
                const targetX = xPositions[stepSubCount - 1] || 0;

                propIcon.innerText = '🧹';
                propIcon.style.transform = `translate(${targetX}px, 85px) rotate(-25deg) scale(1.1)`;
                propIcon.className = 'text-6xl md:text-7xl transition-all duration-300 opacity-100';
                
                SoundFX.playSweep();

                // Clear visual sweeping effect: Highlight target item & fly it into the trash bin 🗑️
                if (dirtItem) {
                    dirtItem.classList.add('scale-125', 'brightness-125');
                    
                    setTimeout(() => {
                        dirtItem.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
                        dirtItem.style.transform = 'translate(180px, -20px) scale(0.2) rotate(180deg)';
                        dirtItem.style.opacity = '0';
                        showDustPuff(targetX);
                    }, 200);
                }

                if (stepSubCount < maxPresses) {
                    speakPrompt(`掃走${currentDirtName}！`);

                    setTimeout(() => {
                        propIcon.className = 'text-8xl transition-all duration-200 opacity-0 scale-50';
                        isProcessingAction = false;
                    }, 700);

                } else {
                    // Step 3 / Game Victory Completion
                    speakPrompt(`掃走${currentDirtName}！馬廄完全乾淨了！`);

                    setTimeout(() => {
                        propIcon.className = 'text-8xl transition-all duration-200 opacity-0 scale-50';
                        document.getElementById('barn-dirt-container').classList.add('hidden');
                        triggerVictory();
                    }, 1100);
                }

            // VICTORY / RESET STATE
            } else if (currentStep === 4) {
                resetGame();
            }
        }

        function triggerVictory() {
            currentStep = 4;
            const horseSvg = document.getElementById('horse-svg');
            const horseEye = document.getElementById('horse-eye');
            const horseEyeHappy = document.getElementById('horse-eye-happy');

            horseSvg.classList.add('animate-horse-happy');
            horseEye.classList.add('hidden');
            horseEyeHappy.classList.remove('hidden');

            document.getElementById('instruction-text').innerText = "🎉 太棒了！小馬照顧完成了！按【拍掣】再玩一次！";
            document.getElementById('switch-text').innerText = "再玩一次 🔄";
            
            SoundFX.playCheer();
            SoundFX.playNeigh();
            showSparkles('🌟', 12);
            speakPrompt("太棒了！你非常細心，小馬現在又乾淨又開心！按拍掣可以再玩一次！");
            isProcessingAction = false;
        }

        function advanceToStep(nextStepNum, instructionMsg) {
            currentStep = nextStepNum;
            stepSubCount = 0;
            isProcessingAction = false;

            for (let i = 1; i <= 3; i++) {
                const node = document.getElementById(`step-node-${i}`);
                if (i <= currentStep) {
                    node.classList.remove('opacity-40');
                    node.classList.add('opacity-100');
                    node.children[0].className = 'w-12 h-12 rounded-full bg-amber-500 text-white font-black flex items-center justify-center text-xl shadow-md border-2 border-amber-700';
                }
            }

            if (nextStepNum === 2) {
                document.getElementById('mud-overlay').classList.remove('hidden');
                document.getElementById('barn-dirt-container').classList.add('hidden');
                for (let j = 1; j <= 5; j++) {
                    const spot = document.getElementById(`mud-${j}`);
                    if (spot) spot.style.opacity = '0.85';
                }
            } else if (nextStepNum === 3) {
                document.getElementById('barn-dirt-container').classList.remove('hidden');
                for (let k = 1; k <= 5; k++) {
                    const dirt = document.getElementById(`dirt-${k}`);
                    if (dirt) {
                        dirt.style.transform = 'none';
                        dirt.style.opacity = '1';
                        dirt.className = 'dirt-item text-4xl md:text-6xl transition-all duration-300 inline-block drop-shadow cursor-pointer';
                    }
                }
            }

            updatePressBadge();
            document.getElementById('instruction-text').innerText = instructionMsg;
            speakPrompt(instructionMsg);
        }

        function resetGame() {
            currentStep = 1;
            stepSubCount = 0;
            isProcessingAction = false;

            const horseSvg = document.getElementById('horse-svg');
            const horseEye = document.getElementById('horse-eye');
            const horseEyeHappy = document.getElementById('horse-eye-happy');

            horseSvg.classList.remove('animate-horse-happy');
            horseEye.classList.remove('hidden');
            horseEyeHappy.classList.add('hidden');

            document.getElementById('switch-text').innerText = "按一下拍掣！";

            for (let i = 2; i <= 3; i++) {
                const node = document.getElementById(`step-node-${i}`);
                node.classList.add('opacity-40');
                node.children[0].className = 'w-12 h-12 rounded-full bg-slate-300 text-slate-700 font-black flex items-center justify-center text-xl border-2 border-slate-400';
            }

            document.getElementById('mud-overlay').classList.add('hidden');
            document.getElementById('barn-dirt-container').classList.add('hidden');

            // Reset ground items
            for (let k = 1; k <= 5; k++) {
                const dirt = document.getElementById(`dirt-${k}`);
                if (dirt) {
                    dirt.style.transform = 'none';
                    dirt.style.opacity = '1';
                    dirt.className = 'dirt-item text-4xl md:text-6xl transition-all duration-300 inline-block drop-shadow cursor-pointer';
                }
            }

            updatePressBadge();
            document.getElementById('instruction-text').innerText = "按一下【拍掣】切紅蘿蔔餵小馬！";
            speakPrompt("歡迎再次照顧小馬！按一下拍掣，切紅蘿蔔餵小馬！");
        }

        // Dust Puff Animation Generator
        function showDustPuff(xPos) {
            const overlay = document.getElementById('effects-overlay');
            const dust = document.createElement('div');
            dust.innerText = '💨';
            dust.className = 'absolute text-4xl transition-all duration-500 pointer-events-none opacity-90';
            dust.style.left = `calc(50% + ${xPos}px)`;
            dust.style.top = '70%';
            overlay.appendChild(dust);
            setTimeout(() => {
                dust.style.transform = 'scale(1.6) translateY(-25px)';
                dust.style.opacity = '0';
            }, 50);
            setTimeout(() => dust.remove(), 550);
        }

        // Sparkle Visual Effects Generator
        function showSparkles(emoji, count) {
            const overlay = document.getElementById('effects-overlay');
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.innerText = emoji;
                el.className = 'absolute text-4xl animate-bounce pointer-events-none transition-all duration-1000';
                el.style.left = `${15 + Math.random() * 70}%`;
                el.style.top = `${20 + Math.random() * 60}%`;
                overlay.appendChild(el);

                setTimeout(() => el.remove(), 1200);
            }
        }

        // Bubble Visual Effects Generator
        function showBubbles() {
            const overlay = document.getElementById('effects-overlay');
            for (let i = 0; i < 8; i++) {
                const bubble = document.createElement('div');
                bubble.innerText = '🫧';
                bubble.className = 'absolute text-3xl transition-transform duration-1000 transform -translate-y-12 opacity-80';
                bubble.style.left = `${20 + Math.random() * 60}%`;
                bubble.style.top = `${40 + Math.random() * 40}%`;
                overlay.appendChild(bubble);

                setTimeout(() => bubble.remove(), 1000);
            }
        }

        // AAC Soundboard Trigger
        function playAAC(type) {
            if (type === 'feed') {
                SoundFX.playCrunch();
                speakPrompt("馬進食，嚼嚼嚼");
            } else if (type === 'water') {
                SoundFX.playWater();
                speakPrompt("擦身洗澡，嘩啦嘩啦");
            } else if (type === 'neigh') {
                SoundFX.playNeigh();
                speakPrompt("小馬，歡快叫聲");
            } else if (type === 'brush') {
                SoundFX.playBrush();
                speakPrompt("刷毛，輕柔梳理");
            } else if (type === 'sweep') {
                SoundFX.playSweep();
                speakPrompt("打掃馬廄，唰唰唰");
            } else if (type === 'cheer') {
                SoundFX.playCheer();
                speakPrompt("讚好拍掌，你好棒");
            }
        }

        // Tab Navigation Switch
        function switchMode(mode) {
            currentMode = mode;
            const gameView = document.getElementById('view-game');
            const soundboardView = document.getElementById('view-soundboard');
            const tabGame = document.getElementById('tab-game');
            const tabSoundboard = document.getElementById('tab-soundboard');

            if (mode === 'game') {
                gameView.classList.remove('hidden');
                soundboardView.classList.add('hidden');
                tabGame.className = 'px-4 py-2 rounded-xl text-base md:text-lg font-bold transition flex items-center gap-2 bg-white text-amber-900 shadow cursor-pointer';
                tabSoundboard.className = 'px-4 py-2 rounded-xl text-base md:text-lg font-bold transition flex items-center gap-2 text-amber-800 hover:bg-amber-100 cursor-pointer';
                speakPrompt("切換到拍掣照顧小馬");
            } else {
                gameView.classList.add('hidden');
                soundboardView.classList.remove('hidden');
                tabSoundboard.className = 'px-4 py-2 rounded-xl text-base md:text-lg font-bold transition flex items-center gap-2 bg-white text-amber-900 shadow cursor-pointer';
                tabGame.className = 'px-4 py-2 rounded-xl text-base md:text-lg font-bold transition flex items-center gap-2 text-amber-800 hover:bg-amber-100 cursor-pointer';
                speakPrompt("切換到自由聲音大按鈕");
            }
        }

        // Settings Modal Handlers
        function openSettingsModal() {
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            speechLang = document.getElementById('setting-lang').value;
            document.getElementById('settings-modal').classList.add('hidden');
            speakPrompt("設定已更新");
        }

        // Welcome Greeting on Load
        window.addEventListener('load', () => {
            setTimeout(() => {
                speakPrompt("歡迎來到照顧小馬！按一下拍掣，切紅蘿蔔餵小馬！");
            }, 600);
        });
    </script>
</body>
