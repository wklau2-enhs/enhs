<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>STEAM 觸覺與聲光因果連結教具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 高對比與視障專用視覺樣式 */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 超大高亮度 LED 發光效果 */
        .led-off {
            background: radial-gradient(circle, #2a2a2a 0%, #111111 70%, #000000 100%);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9), 0 0 0 10px #222;
            border: 8px solid #333333;
        }

        .led-on-yellow {
            background: radial-gradient(circle, #ffffff 0%, #ffea00 40%, #ff9100 80%, #ff5500 100%);
            box-shadow: 0 0 120px #ffea00, 0 0 200px #ffea00, inset 0 0 40px #ffffff;
            border: 8px solid #ffffff;
            animation: pulse-glow 0.5s infinite alternate;
        }

        .led-on-red {
            background: radial-gradient(circle, #ffffff 0%, #ff0055 40%, #cc0000 80%, #660000 100%);
            box-shadow: 0 0 120px #ff0055, 0 0 200px #ff0055, inset 0 0 40px #ffffff;
            border: 8px solid #ffffff;
            animation: pulse-glow 0.5s infinite alternate;
        }

        .led-on-green {
            background: radial-gradient(circle, #ffffff 0%, #00ff66 40%, #009933 80%, #003311 100%);
            box-shadow: 0 0 120px #00ff66, 0 0 200px #00ff66, inset 0 0 40px #ffffff;
            border: 8px solid #ffffff;
            animation: pulse-glow 0.5s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.98); opacity: 0.95; }
            100% { transform: scale(1.02); opacity: 1; }
        }

        /* 音樂合奏動態飄浮音符 */
        .music-note {
            position: absolute;
            font-size: 2.5rem;
            color: #ffea00;
            text-shadow: 0 0 10px rgba(255, 234, 0, 0.8);
            animation: float-note 2s infinite ease-out;
            pointer-events: none;
        }

        @keyframes float-note {
            0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.4) rotate(20deg); opacity: 0; }
        }

        /* 超大觸控/顯示區域 */
        .interactive-area {
            cursor: pointer;
            transition: all 0.1s ease-out;
        }

        .interactive-area:active {
            transform: scale(0.97);
        }

        /* 視障高對比文字提示 */
        .hi-contrast-text {
            text-shadow: 0 0 20px #000, 0 0 10px #000;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-4 relative">

    <!-- 頂部老師控制列（微縮隱藏，不分散學生注意力） -->
    <header class="flex justify-between items-center z-50 bg-gray-900/80 backdrop-blur border border-gray-800 rounded-2xl p-3 text-white">
        <div class="flex items-center gap-3">
            <span class="bg-red-600 text-white font-bold px-3 py-1 rounded-lg text-sm tracking-wide">語文/STEAM 教具</span>
            <h1 class="text-lg font-bold hidden sm:inline text-gray-200">拍掣因果連結遊戲</h1>
        </div>

        <div class="flex items-center gap-4">
            <!-- 嘗試計數器（方便老師紀錄 IEP 或隨堂評估） -->
            <div class="bg-black/60 px-4 py-1.5 rounded-xl border border-gray-700 flex items-center gap-2">
                <i class="fa-solid fa-calculator text-yellow-400"></i>
                <span class="text-xs text-gray-400">通電次數:</span>
                <span id="trial-counter" class="text-xl font-extrabold text-yellow-400">0</span>

                </button>
            </div>

            <!-- 控制面板選單按鈕 -->
            <button id="btn-toggle-settings" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-1.5 rounded-xl text-sm flex items-center gap-2 border border-gray-700 transition">
                <i class="fa-solid fa-sliders"></i>
                <span>老師設定</span>
            </button>
        </div>
    </header>

    <!-- 主要感官刺激區（iPad 畫面中心） -->
    <main class="flex-1 flex flex-col items-center justify-center relative my-4">
        
        <!-- 全螢幕閃爍背景（強化高組與弱視視覺刺激） -->
        <div id="flash-bg" class="absolute inset-0 rounded-3xl opacity-0 transition-opacity duration-100 pointer-events-none"></div>

        <!-- 音符漂浮容器 (音樂合奏用) -->
        <div id="music-notes-container" class="absolute inset-0 overflow-hidden pointer-events-none z-20"></div>

        <!-- 中心超大燈光/按鈕視覺標的 -->
        <div id="interactive-target" class="interactive-area relative w-72 h-72 sm:w-96 sm:h-96 rounded-full flex flex-col items-center justify-center transition-all duration-150 led-off z-10">
            <!-- 燈光/音樂圖示 -->
            <div id="target-icon-container" class="text-gray-600 transition-all duration-200 mb-2">
                <i id="target-icon" class="fa-solid fa-music text-7xl sm:text-9xl"></i>
            </div>
            
            <!-- 大字體狀態文字（結合語文/狀態辨識） -->
            <div id="target-text" class="text-3xl sm:text-5xl font-black tracking-widest text-gray-500 hi-contrast-text text-center px-4">
                拍掣加入合奏
            </div>
            <div id="sub-status-text" class="text-sm sm:text-lg font-bold text-gray-600 mt-2 tracking-wider">
                【 音樂準備中 Off 】
            </div>
        </div>

        <!-- 底部提示文字（供學生/老師參考） -->
        <div class="mt-6 text-center z-10">

                <i class="fa-solid fa-hand-pointer text-yellow-400 mr-2"></i>【拍一下拍掣】開啟亮燈並播放音樂，一起合奏！
            </p>
        </div>
    </main>

    <!-- 狀態標示列（方便高組學生辨識 On / Off 物理狀態） -->
    <footer class="grid grid-cols-2 gap-4 z-50">
        <div id="status-card-on" class="bg-gray-900/90 border-2 border-gray-800 rounded-2xl p-3 flex items-center justify-center gap-3 transition-all duration-200">
            <div class="w-5 h-5 rounded-full bg-gray-700 id-dot-on"></div>

    <!-- 老師設定面板 Modal (預設隱藏) -->

                        <option value="ensemble_macdonald">🚜 麥克唐納老伯伯有農場 (Old MacDonald Had a Farm)</option>
                        <option value="ensemble_baby_shark">🦈 Baby Shark 鯊魚寶寶律動 (Baby Shark)</option>
                        <option value="ensemble_bingo">🐶 B-I-N-G-O 賓果小狗 (Bingo Song)</option>
                        <option value="ensemble_doremi">🎶 Do-Re-Mi 聲樂之歌 (Do-Re-Mi Song)</option>
                        <option value="ensemble_wheels_bus">🚌 巴士輪轉啊轉 (Wheels on the Bus)</option>
                        <option value="ensemble_london_bridge">🌉 倫敦鐵橋垮下來 (London Bridge)</option>

                        <option value="ensemble_snails">🐌 蝸牛與黃鸝鳥 (The Snail & Oriole)</option>
                        <option value="ensemble_jingle_bells">🔔 叮叮噹聖誕鈴聲 (Jingle Bells)</option>
                        <option value="ensemble_canon">🎼 帕赫貝爾卡農經典 (Pachelbel's Canon)</option>
                        <option value="ensemble_mario">🎮 復古電玩冒險 8-Bit (Retro Mario Chiptune)</option>

                    完成並開始練習

        </div>
    </div>

        // 初始化 Web Audio API (確保在 iPad 上由使用者第一次點擊/拍打時啟動)
        function initAudioContext() {
            if (!state.audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                state.audioCtx = new AudioContext();
            }
            if (state.audioCtx.state === 'suspended') {
                state.audioCtx.resume();
            }
        }

        // 停止當前所有聲音與定時器
        function stopAllAudio() {
            state.activeOscillators.forEach(osc => {
                try { osc.stop(); osc.disconnect(); } catch(e) {}
            });
            state.activeOscillators = [];

            if (state.musicTimer) {
                clearTimeout(state.musicTimer);
                clearInterval(state.musicTimer);
                state.musicTimer = null;
            }

            if (state.noteFloatInterval) {
                clearInterval(state.noteFloatInterval);
                state.noteFloatInterval = null;
            }

            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }

            if (musicNotesContainer) {
                musicNotesContainer.innerHTML = '';
            }
        }

            const track = melodies[state.soundType] || melodies.ensemble_happy;
            let noteIdx = 0;

            function scheduleNextNote() {
                if (!state.isOn || !state.audioCtx) return;

                const item = track[noteIdx];
                const noteList = item.notes || (item.note ? [item.note] : []);
                const dur = item.dur || 0.3;
                const waveType = item.type || 'sine';

                noteList.forEach(freq => {
                    if (freq <= 0) return;
                    const osc = state.audioCtx.createOscillator();
                    const gain = state.audioCtx.createGain();

                    osc.type = waveType;
                    osc.frequency.setValueAtTime(freq, state.audioCtx.currentTime);

                    const volume = 0.22 / Math.sqrt(noteList.length);
                    gain.gain.setValueAtTime(volume, state.audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, state.audioCtx.currentTime + dur);

                    osc.connect(gain);
                    gain.connect(state.audioCtx.destination);

                    osc.start();
                    osc.stop(state.audioCtx.currentTime + dur);
                    state.activeOscillators.push(osc);
                });

                noteIdx = (noteIdx + 1) % track.length;
                state.musicTimer = setTimeout(scheduleNextNote, dur * 1000);
            }

            // 立即播放第一音
            scheduleNextNote();

            // 動態產生音符動畫
            spawnMusicNoteAnimation();
            state.noteFloatInterval = setInterval(spawnMusicNoteAnimation, 500);
        }

        // 動態產生漂浮音符（感官視覺加強）
        function spawnMusicNoteAnimation() {
            if (!state.isOn || !musicNotesContainer) return;
            const noteEl = document.createElement('i');
            const icons = ['fa-music', 'fa-note-sticky', 'fa-bell', 'fa-drum'];
            const randomIcon = icons[Math.floor(Math.random() * icons.length)];
            
            noteEl.className = `fa-solid ${randomIcon} music-note`;
            noteEl.style.left = `${15 + Math.random() * 70}%`;
            noteEl.style.top = `${50 + Math.random() * 20}%`;
            
            musicNotesContainer.appendChild(noteEl);
            setTimeout(() => {
                if (noteEl && noteEl.parentNode) {
                    noteEl.parentNode.removeChild(noteEl);
                }
            }, 2000);
        }

        // 播放低電壓蜂鳴器音效 (Buzzer)
        function playBuzzerSound() {
            if (!state.audioCtx) return;
            stopAllAudio();

            const osc = state.audioCtx.createOscillator();
            const gain = state.audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(520, state.audioCtx.currentTime);

            gain.gain.setValueAtTime(0.3, state.audioCtx.currentTime);

            osc.connect(gain);
            gain.connect(state.audioCtx.destination);

            osc.start();
            state.activeOscillators.push(osc);
        }

        // 播放粵語/中文語音
        function playSpeechPrompt(text) {
            if (!('speechSynthesis' in window)) return;
            stopAllAudio();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-HK';
            utterance.rate = 0.9;
            utterance.pitch = 1.2;

            window.speechSynthesis.speak(utterance);
        }

        // 接通電路 (Turn ON)
        function turnOn() {
            if (state.isOn) return;
            state.isOn = true;
            initAudioContext();

            // 累加計數
            state.trialCount++;
            trialCounterEl.textContent = state.trialCount;

            // 1. 視覺更新 (Visual Feedback)
            if (state.sensoryMode === 'both' || state.sensoryMode === 'light') {
                interactiveTarget.className = `interactive-area relative w-72 h-72 sm:w-96 sm:h-96 rounded-full flex flex-col items-center justify-center transition-all duration-150 led-on-${state.ledColor} z-10`;
                
                // 發光背景
                flashBg.className = `absolute inset-0 rounded-3xl opacity-40 pointer-events-none transition-opacity duration-100 ${
                    state.ledColor === 'yellow' ? 'bg-yellow-400' : state.ledColor === 'red' ? 'bg-red-500' : 'bg-green-400'
                }`;

                targetIconContainer.className = "text-black drop-shadow-lg mb-2 transform scale-110 transition-all duration-200";
                targetIcon.className = "fa-solid fa-compact-disc fa-spin text-7xl sm:text-9xl"; // 音樂唱片旋轉動畫
                targetText.textContent = "音樂合奏中！";
                targetText.className = "text-4xl sm:text-6xl font-black tracking-widest text-black hi-contrast-text text-center px-4 animate-bounce";
                subStatusText.textContent = "【 音樂播放 On 】";
                subStatusText.className = "text-base sm:text-xl font-black text-gray-900 bg-white/80 px-3 py-0.5 rounded-full mt-2";
            } else {
                // 純聲音模式
                targetText.textContent = "合奏演奏中！";
                targetText.className = "text-4xl sm:text-6xl font-black tracking-widest text-yellow-400 hi-contrast-text text-center px-4";
                subStatusText.textContent = "【 音樂播放 On 】";
                subStatusText.className = "text-base sm:text-xl font-bold text-yellow-300 mt-2";
            }

            // 更新 Footer 狀態卡片
            statusCardOn.className = "bg-yellow-500 border-2 border-yellow-300 rounded-2xl p-3 flex items-center justify-center gap-3 transition-all duration-200 shadow-lg scale-105";
            statusCardOn.querySelector('.id-dot-on').className = "w-5 h-5 rounded-full bg-black id-dot-on animate-ping";
            statusCardOn.querySelector('.status-label-on').className = "text-lg sm:text-xl font-black text-black status-label-on";

            statusCardOff.className = "bg-gray-900/60 border-2 border-gray-800 rounded-2xl p-3 flex items-center justify-center gap-3 transition-all duration-200 opacity-50";
            statusCardOff.querySelector('.id-dot-off').className = "w-5 h-5 rounded-full bg-gray-700 id-dot-off";
            statusCardOff.querySelector('.status-label-off').className = "text-lg sm:text-xl font-black text-gray-500 status-label-off";

            // 2. 聽覺更新 (Auditory Feedback)
            if (state.sensoryMode === 'both' || state.sensoryMode === 'sound') {
                if (state.soundType.startsWith('ensemble')) {
                    startEnsembleMusic();
                } else if (state.soundType === 'buzzer') {
                    playBuzzerSound();
                } else if (state.soundType === 'speech') {
                    playSpeechPrompt("一起來音樂合奏！真棒！");
                }
            }
        }

        // 斷開電路 (Turn OFF)
        function turnOff() {
            if (!state.isOn) return;
            state.isOn = false;

            stopAllAudio();

            // 1. 視覺恢復 OFF 狀態
            interactiveTarget.className = "interactive-area relative w-72 h-72 sm:w-96 sm:h-96 rounded-full flex flex-col items-center justify-center transition-all duration-150 led-off z-10";
            flashBg.className = "absolute inset-0 rounded-3xl opacity-0 transition-opacity duration-100 pointer-events-none";

            targetText.textContent = "拍掣加入合奏";
            targetText.className = "text-3xl sm:text-5xl font-black tracking-widest text-gray-500 hi-contrast-text text-center px-4";
            subStatusText.textContent = "【 音樂準備中 Off 】";
            subStatusText.className = "text-sm sm:text-lg font-bold text-gray-600 mt-2 tracking-wider";

        // 處理按壓開始 (Down Event)
        function handleTriggerStart(e) {
            if (e) e.preventDefault();
            initAudioContext();

            if (state.triggerMode === 'hold') {
                turnOn();
            } else if (state.triggerMode === 'toggle') {
                if (state.isOn) {
                    turnOff();
                } else {
                    turnOn();
                }
            }
        }

        // 處理按壓結束 (Up Event)
        function handleTriggerEnd(e) {
            if (e) e.preventDefault();
            if (state.triggerMode === 'hold') {
                turnOff();
            }
        }

        // 綁定 iPad 觸控 / 滑鼠點擊
        interactiveTarget.addEventListener('pointerdown', handleTriggerStart);
        interactiveTarget.addEventListener('pointerup', handleTriggerEnd);
        interactiveTarget.addEventListener('pointerleave', handleTriggerEnd);

        // 綁定鍵盤/iPad 藍芽拍掣 Key Down & Key Up
        let isKeyDown = false;
        window.addEventListener('keydown', (e) => {
            if (!settingsModal.classList.contains('hidden')) return;

            if (e.code === 'Space' || e.code === 'Enter' || e.key === ' ' || e.key === 'Enter') {
                if (!isKeyDown) {
                    isKeyDown = true;
                    handleTriggerStart(e);
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' || e.code === 'Enter' || e.key === ' ' || e.key === 'Enter') {
                isKeyDown = false;
                handleTriggerEnd(e);
            }
        });

        // 重置計數器
        btnResetCount.addEventListener('click', (e) => {
            e.stopPropagation();
            state.trialCount = 0;
            trialCounterEl.textContent = '0';
        });

        // 打開與關閉設定 Modal
        btnToggleSettings.addEventListener('click', () => {
            settingsModal.classList.remove('hidden');
        });

        btnCloseSettings.addEventListener('click', () => {
            settingsModal.classList.add('hidden');
        });

        btnSaveSettings.addEventListener('click', () => {
            settingsModal.classList.add('hidden');
        });

        // 切換按壓模式
        document.querySelectorAll('.btn-trig-mode').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const trig = e.currentTarget.dataset.trig;
                state.triggerMode = trig;

                document.querySelectorAll('.btn-trig-mode').forEach(b => {
                    b.className = "btn-trig-mode bg-gray-800 text-gray-300 font-bold p-3 rounded-xl border border-gray-700 text-center";
                });
                e.currentTarget.className = "btn-trig-mode bg-yellow-600 text-white font-bold p-3 rounded-xl border border-yellow-400 text-center";
                
                instructionHint.innerHTML = trig === 'toggle' 
                    ? '<i class="fa-solid fa-hand-pointer text-yellow-400 mr-2"></i>【拍一下拍掣】開啟亮燈並播放音樂，一起合奏！'
                    : '<i class="fa-solid fa-hand-pointer text-yellow-400 mr-2"></i>【按住拍掣】亮燈播放音樂，【鬆開】停止';
            });
        });

        // 切換多感官模式
        document.querySelectorAll('.btn-sensory-mode').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const mode = e.currentTarget.dataset.mode;
                state.sensoryMode = mode;

                document.querySelectorAll('.btn-sensory-mode').forEach(b => {
                    b.className = "btn-sensory-mode bg-gray-800 text-gray-300 font-bold p-2.5 rounded-xl border border-gray-700 text-center text-xs";
                });
                e.currentTarget.className = "btn-sensory-mode bg-yellow-600 text-white font-bold p-2.5 rounded-xl border border-yellow-400 text-center text-xs";
            });
        });

        // 選擇聲音/合奏類型
        selectSoundType.addEventListener('change', (e) => {
            state.soundType = e.target.value;
            if (state.isOn) {
                turnOff();
                turnOn();
            }
        });

        // 選擇高對比 LED 色彩
        document.querySelectorAll('.btn-color-select').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const color = e.currentTarget.dataset.color;
                state.ledColor = color;

                document.querySelectorAll('.btn-color-select').forEach(b => {
                    b.classList.add('opacity-60');
                });
                e.currentTarget.classList.remove('opacity-60');
            });
        });

        window.onload = function() {
            console.log("STEAM 音樂合奏與因果連結教具載入完成！ Ready for Music Ensemble Switch Interaction.");
        };
    </script>
</body>
</html>
