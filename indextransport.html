<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港交通工具配對遊戲</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      touch-action: manipulation;
      user-select: none;
    }
    .high-contrast {
      background-color: #000000 !important;
      color: #FFFF00 !important;
    }
    .high-contrast .card-bg {
      background-color: #111111 !important;
      border: 4px solid #FFFF00 !important;
      color: #FFFFFF !important;
    }
    .high-contrast .btn-primary {
      background-color: #FFFF00 !important;
      color: #000000 !important;
      font-weight: 900 !important;
    }
    .card-hover {
      transition: all 0.2s ease-in-out;
    }
    .card-hover:active {
      transform: scale(0.95);
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }
    .target-prompt {
      animation: pulse-ring 2s infinite;
    }
  </style>
</head>
<body class="bg-amber-50 min-h-screen text-slate-800 flex flex-col transition-colors duration-300">

  <!-- 頂部列與特教輔助設定 -->
  <header class="bg-teal-600 text-white p-4 shadow-lg flex flex-wrap justify-between items-center gap-3">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-bus text-3xl md:text-4xl"></i>
      <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide">香港交通工具配對遊戲</h1>
    </div>
    
    <div class="flex items-center gap-2">
      <!-- 高對比度切換 -->
      <button id="contrastBtn" class="px-4 py-2 bg-yellow-400 text-slate-900 rounded-xl font-bold text-lg hover:bg-yellow-300 flex items-center gap-2 shadow">
        <i class="fa-solid fa-eye text-xl"></i>
        <span>大字高對比</span>
      </button>
      <!-- 語音重複朗讀按鈕 -->
      <button id="repeatAudioBtn" class="px-4 py-2 bg-emerald-400 text-slate-900 rounded-xl font-bold text-lg hover:bg-emerald-300 flex items-center gap-2 shadow">
        <i class="fa-solid fa-volume-high text-xl"></i>
        <span>重聽題目</span>
      </button>
    </div>
  </header>

  <!-- 主內容區域 -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 flex flex-col items-center justify-start gap-6">

    <!-- 遊戲模式選擇器 -->
    <div class="w-full flex justify-center gap-4 mt-2">
      <button id="modeFindBtn" class="flex-1 max-w-xs py-3 px-6 bg-indigo-600 text-white font-extrabold text-xl rounded-2xl shadow-lg border-b-4 border-indigo-800 hover:bg-indigo-500 transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-bullseye"></i>
        <span>模式一：聽聲認車</span>
      </button>
      <button id="modePairBtn" class="flex-1 max-w-xs py-3 px-6 bg-slate-300 text-slate-700 font-extrabold text-xl rounded-2xl shadow-md border-b-4 border-slate-400 hover:bg-slate-200 transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-clone"></i>
        <span>模式二：翻牌配對</span>
      </button>
    </div>

    <!-- 模式一：目標指示看板 (聽語音找交通工具) -->
    <section id="findModeSection" class="w-full flex flex-col items-center gap-6">
      <div class="w-full card-bg bg-white p-6 rounded-3xl shadow-xl border-4 border-indigo-200 text-center flex flex-col items-center justify-center gap-3 target-prompt">
        <span class="text-lg md:text-xl font-bold text-slate-500">請按提示找出正確的交通工具：</span>
        <div class="flex items-center justify-center gap-4 flex-wrap">
          <span id="targetName" class="text-4xl md:text-6xl font-black text-indigo-700 tracking-wider">【渡海小輪】</span>
          <button id="speakTargetBtn" class="p-4 bg-indigo-100 text-indigo-700 rounded-full hover:bg-indigo-200 text-3xl shadow active:scale-95">
            <i class="fa-solid fa-volume-high"></i>
          </button>
        </div>
      </div>

      <!-- 交通工具選項卡片網格 -->
      <div id="optionsGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6 w-full">
        <!-- 卡片會由 JS 動態生成 -->
      </div>
    </section>

    <!-- 模式二：翻牌配對遊戲區域 -->
    <section id="pairModeSection" class="w-full hidden flex-col items-center gap-6">
      <div class="w-full card-bg bg-white p-4 rounded-2xl shadow-md text-center flex justify-between items-center px-8">
        <span class="text-xl md:text-2xl font-extrabold text-indigo-800">配對進度：<span id="pairMatchScore" class="text-amber-600">0</span> / 6 對</span>
        <button id="resetPairGameBtn" class="px-5 py-2 bg-amber-500 text-white font-bold rounded-xl text-lg hover:bg-amber-600 shadow">
          <i class="fa-solid fa-rotate-right mr-1"></i> 重新開始
        </button>
      </div>

      <div id="memoryCardsGrid" class="grid grid-cols-3 md:grid-cols-4 gap-4 w-full">
        <!-- 記憶對對碰卡片由 JS 動態生成 -->
      </div>
    </section>

  </main>

  <!-- 答對彈出激勵視窗 (Modal) -->
  <div id="successModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="card-bg bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl border-4 border-emerald-400 flex flex-col items-center gap-4 active:scale-100 transition-all">
      <div class="w-24 h-24 bg-emerald-100 rounded-full flex items-center justify-center text-emerald-500 text-6xl shadow-inner">
        <i class="fa-solid fa-star"></i>
      </div>
      <h2 id="modalTitle" class="text-3xl md:text-4xl font-black text-slate-800">答對了！太棒了！</h2>
      <p id="modalDesc" class="text-2xl font-bold text-emerald-600">這是 【渡海小輪】</p>
      <button id="nextQuestionBtn" class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-2xl rounded-2xl shadow-lg border-b-4 border-emerald-700 transition-all active:scale-95">
        下一題 <i class="fa-solid fa-arrow-right ml-2"></i>
      </button>
    </div>
  </div>

  <!-- 底部說明 -->
  <footer class="p-4 text-center text-slate-500 font-medium text-sm">
    專為特殊學校人文科「香港今昔：近代交通」設計多感官輔助教材
  </footer>

  <script>
    // 輔助函數：將原生 SVG 字串轉換為 100% 穩定的 Data URI（防止瀏覽器解析錯誤）

      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString.trim());
    }

            <linearGradient id='greenTop' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='#15803d'/><stop offset='100%' stop-color='#14532d'/></linearGradient>

          <rect width='500' height='350' fill='url(#sky)'/>
          <rect x='0' y='200' width='500' height='150' fill='#f59e0b' opacity='0.3'/>

          <rect x='360' y='30' width='120' height='180' fill='#cbd5e1' opacity='0.5' rx='4'/>
          <!-- 人力車主體（精準對應圖片 image_755177.jpg：紅車身、綠車篷、黑輪輻、長車把） -->

          <circle cx='300' cy='230' r='75' fill='none' stroke='#0f172a' stroke-width='10'/>

          <path d='M180 100 Q250 40 320 80 Q300 120 180 100 Z' fill='url(#greenTop)'/>
          <path d='M175 100 Q250 115 325 80' stroke='#166534' stroke-width='6' fill='none'/>
          <!-- 前伸長車把斜支架 -->
          <path d='M240 215 L80 280 L75 295 L95 295 L250 225 Z' fill='#dc2626'/>
          <path d='M80 280 L70 285 L235 220' stroke='#991b1b' stroke-width='4'/>
          <!-- 標題標籤 -->
          <rect x='150' y='12' width='200' height='36' rx='18' fill='#1e293b' opacity='0.85'/>
          <text x='250' y='36' font-family='sans-serif' font-size='18' font-weight='900' text-anchor='middle' fill='#fef08a'>香港人力車</text>
        </svg>
      `),

            <linearGradient id='sea' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='#0284c7'/><stop offset='100%' stop-color='#0369a1'/></linearGradient>

          <rect width='500' height='350' fill='url(#skyFerry)'/>
          <!-- 香港天際線背景 -->
          <path d='M0 180 L40 160 L90 180 L180 130 L240 180 L350 140 L420 170 L500 150 L500 200 L0 200 Z' fill='#64748b' opacity='0.35'/>

          <g fill='#0369a1'>

            <rect x='145' y='198' width='22' height='16' rx='3'/>
            <rect x='180' y='198' width='22' height='16' rx='3'/>

            <rect x='250' y='198' width='22' height='16' rx='3'/>
            <rect x='285' y='198' width='22' height='16' rx='3'/>

            <rect x='355' y='198' width='22' height='16' rx='3'/>
          </g>
          <!-- 綠色船頂與煙囪 -->
          <path d='M70 180 L100 160 L400 160 L430 180 Z' fill='#065f46'/>
          <rect x='230' y='130' width='35' height='30' fill='#065f46' rx='4'/>

          <rect x='150' y='12' width='200' height='36' rx='18' fill='#1e293b' opacity='0.85'/>
          <text x='250' y='36' font-family='sans-serif' font-size='18' font-weight='900' text-anchor='middle' fill='#38bdf8'>天星小輪 Star Ferry</text>
        </svg>
      `),
      mtr: makeSvgUri(`
        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 350'>

          <path d='M60 90 L440 90 L420 160 L80 160 Z' fill='#dc2626'/>
          <rect x='100' y='100' width='300' height='50' rx='8' fill='#020617'/>
          <rect x='180' y='65' width='140' height='22' rx='4' fill='#000000'/>
          <text x='250' y='80' font-family='sans-serif' font-size='13' font-weight='bold' text-anchor='middle' fill='#22c55e'>荃灣 TSUEN WAN</text>
          <!-- 港鐵紅色圓圈標誌 -->
          <circle cx='250' cy='195' r='20' fill='#dc2626'/>
          <path d='M238 195 Q250 180 262 195 Q250 210 238 195' fill='none' stroke='#ffffff' stroke-width='4'/>
          <line x1='250' y1='178' x2='250' y2='212' stroke='#ffffff' stroke-width='4'/>
          <circle cx='100' cy='220' r='12' fill='#fef08a'/>
          <circle cx='400' cy='220' r='12' fill='#fef08a'/>
          <rect x='150' y='12' width='200' height='36' rx='18' fill='#000000' opacity='0.85'/>
          <text x='250' y='36' font-family='sans-serif' font-size='18' font-weight='900' text-anchor='middle' fill='#ef4444'>香港港鐵 MTR</text>
        </svg>
      `),
      airplane: makeSvgUri(`
        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 350'>
          <defs>
            <linearGradient id='skyAir' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='#0284c7'/><stop offset='100%' stop-color='#7dd3fc'/></linearGradient>
          </defs>
          <rect width='500' height='350' fill='url(#skyAir)'/>
          <ellipse cx='100' cy='260' rx='90' ry='40' fill='#ffffff' opacity='0.8'/>
          <ellipse cx='380' cy='280' rx='120' ry='50' fill='#ffffff' opacity='0.8'/>
          <ellipse cx='240' cy='300' rx='150' ry='40' fill='#ffffff'/>
          <!-- 客機主體 -->
          <path d='M50 180 C150 165 330 135 450 90 C465 125 410 165 350 178 C250 195 110 200 50 180 Z' fill='#ffffff'/>
          <path d='M210 170 L300 50 L340 50 L270 165 Z' fill='#0284c7'/>
          <path d='M190 182 L240 280 L270 280 L230 182 Z' fill='#0369a1'/>
          <path d='M70 175 L40 100 L80 100 L110 170 Z' fill='#059669'/>
          <rect x='150' y='12' width='200' height='36' rx='18' fill='#1e293b' opacity='0.85'/>
          <text x='250' y='36' font-family='sans-serif' font-size='18' font-weight='900' text-anchor='middle' fill='#38bdf8'>飛機 Airplane</text>
        </svg>
      `),
      bus: makeSvgUri(`
        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 350'>
          <rect width='500' height='350' fill='#f1f5f9'/>
          <rect x='0' y='270' width='500' height='80' fill='#475569'/>
          <!-- 香港雙層巴士 -->
          <rect x='80' y='35' width='340' height='230' fill='#dc2626' rx='24'/>
          <rect x='100' y='55' width='300' height='60' fill='#0f172a' rx='10'/>
          <line x1='175' y1='55' x2='175' y2='115' stroke='#475569' stroke-width='3'/>
          <line x1='250' y1='55' x2='250' y2='115' stroke='#475569' stroke-width='3'/>
          <line x1='325' y1='55' x2='325' y2='115' stroke='#475569' stroke-width='3'/>
          <rect x='100' y='140' width='210' height='60' fill='#0f172a' rx='10'/>
          <rect x='325' y='140' width='75' height='100' fill='#334155' rx='4'/>
          <line x1='362' y1='140' x2='362' y2='240' stroke='#facc15' stroke-width='3'/>
          <rect x='160' y='10' width='180' height='24' fill='#000000' rx='4'/>
          <text x='250' y='27' font-family='sans-serif' font-size='14' font-weight='bold' text-anchor='middle' fill='#facc15'>1A 中環 CENTRAL</text>
          <rect x='80' y='125' width='340' height='10' fill='#facc15'/>
          <circle cx='150' cy='265' r='30' fill='#0f172a'/>
          <circle cx='150' cy='265' r='14' fill='#94a3b8'/>
          <circle cx='350' cy='265' r='30' fill='#0f172a'/>
          <circle cx='350' cy='265' r='14' fill='#94a3b8'/>
          <rect x='150' y='312' width='200' height='32' rx='16' fill='#1e293b' opacity='0.85'/>
          <text x='250' y='334' font-family='sans-serif' font-size='16' font-weight='900' text-anchor='middle' fill='#facc15'>香港雙層巴士 KMB</text>
        </svg>
      `),
      taxi: makeSvgUri(`
        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 350'>
          <rect width='500' height='350' fill='#e2e8f0'/>
          <rect x='0' y='260' width='500' height='90' fill='#64748b'/>
          <!-- 香港市區紅色的士 Toyota Crown Comfort -->
          <path d='M50 220 L65 150 L140 140 L190 85 L350 85 L405 140 L450 150 L465 220 L450 255 L50 255 Z' fill='#dc2626'/>

    const TRANSPORTS = [
      {
        id: 'rickshaw',
        name: '人力車',

        fallbackIcon: 'fa-taxi',

    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      },
      playSuccess() {
        this.init();
        const now = this.ctx.currentTime;
        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc1.type = 'sine';
        osc2.type = 'triangle';

        osc1.frequency.setValueAtTime(523.25, now);
        osc1.frequency.setValueAtTime(659.25, now + 0.1);
        osc1.frequency.setValueAtTime(783.99, now + 0.2);
        osc1.frequency.setValueAtTime(1046.50, now + 0.3);

        osc2.frequency.setValueAtTime(261.63, now);
        osc2.frequency.setValueAtTime(329.63, now + 0.1);
        osc2.frequency.setValueAtTime(392.00, now + 0.2);
        osc2.frequency.setValueAtTime(523.25, now + 0.3);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(this.ctx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.6);
        osc2.stop(now + 0.6);
      },
      playTryAgain() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.setValueAtTime(180, now + 0.15);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.3);
      }
    };

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-HK';
        utterance.rate = 0.85;
        utterance.pitch = 1.1;
        window.speechSynthesis.speak(utterance);
      }
    }

    let currentMode = 'find';
    let currentTargetItem = null;
    let highContrastMode = false;

    let pairCards = [];
    let flippedCards = [];
    let matchedPairsCount = 0;

    const modeFindBtn = document.getElementById('modeFindBtn');
    const modePairBtn = document.getElementById('modePairBtn');
    const findModeSection = document.getElementById('findModeSection');
    const pairModeSection = document.getElementById('pairModeSection');
    const optionsGrid = document.getElementById('optionsGrid');
    const targetName = document.getElementById('targetName');
    const speakTargetBtn = document.getElementById('speakTargetBtn');
    const repeatAudioBtn = document.getElementById('repeatAudioBtn');
    const contrastBtn = document.getElementById('contrastBtn');
    const successModal = document.getElementById('successModal');
    const modalDesc = document.getElementById('modalDesc');
    const nextQuestionBtn = document.getElementById('nextQuestionBtn');
    const memoryCardsGrid = document.getElementById('memoryCardsGrid');
    const pairMatchScore = document.getElementById('pairMatchScore');
    const resetPairGameBtn = document.getElementById('resetPairGameBtn');

    window.addEventListener('DOMContentLoaded', () => {
      initFindMode();
      setupEventListeners();
    });

    function initFindMode() {
      const randomIndex = Math.floor(Math.random() * TRANSPORTS.length);
      currentTargetItem = TRANSPORTS[randomIndex];

      targetName.textContent = `【${currentTargetItem.name}】`;
      
      setTimeout(() => {
        speakText(`請找出，${currentTargetItem.name}`);
      }, 300);

      const shuffledOptions = [...TRANSPORTS].sort(() => Math.random() - 0.5);
      optionsGrid.innerHTML = '';

      shuffledOptions.forEach(item => {
        const card = document.createElement('button');
        card.className = `card-bg bg-white border-4 border-slate-200 rounded-3xl p-3 shadow-lg card-hover flex flex-col items-center justify-between gap-3 text-center min-h-[220px] md:min-h-[260px] cursor-pointer focus:outline-none focus:ring-4 focus:ring-yellow-400`;
        
        // 關鍵處：加上 referrerpolicy="no-referrer" 防攔截，並提供自動無縫 SVG 降級
        card.innerHTML = `
          <div class="relative w-full h-36 md:h-44 rounded-2xl overflow-hidden bg-slate-100 flex items-center justify-center">
            <img src="${item.img}" referrerpolicy="no-referrer" alt="${item.name}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='${item.fallbackImg}';">
            <span class="absolute top-2 left-2 px-3 py-1 bg-black/60 text-white rounded-full text-xs font-bold backdrop-blur-sm">${item.era}</span>
          </div>
          <div class="w-full flex items-center justify-between px-2">
            <span class="text-2xl md:text-3xl font-black text-slate-800">${item.name}</span>
            <span class="p-2 bg-slate-100 rounded-full text-slate-600 hover:text-indigo-600 text-xl"><i class="fa-solid fa-volume-high"></i></span>
          </div>
        `;

        card.addEventListener('click', () => handleOptionClick(item));
        optionsGrid.appendChild(card);
      });
    }

    function handleOptionClick(selectedItem) {
      if (selectedItem.id === currentTargetItem.id) {
        AudioEngine.playSuccess();
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        speakText(`答對了！這是${selectedItem.name}。`);
        
        modalDesc.textContent = `這是 【${selectedItem.name}】`;
        successModal.classList.remove('hidden');
      } else {
        AudioEngine.playTryAgain();
        speakText(`這是${selectedItem.name}，請再試試看！找找${currentTargetItem.name}`);
      }
    }

    function initPairMode() {
      matchedPairsCount = 0;
      pairMatchScore.textContent = '0';
      flippedCards = [];
      
      pairCards = [];
      TRANSPORTS.forEach(item => {
        pairCards.push({
          uid: item.id + '_img',
          id: item.id,
          name: item.name,
          type: 'image',
          img: item.img,
          fallbackImg: item.fallbackImg,
          fallbackIcon: item.fallbackIcon,
          isFlipped: false,
          isMatched: false
        });
        pairCards.push({
          uid: item.id + '_txt',
          id: item.id,
          name: item.name,
          type: 'text',
          color: item.color,
          isFlipped: false,
          isMatched: false
        });
      });

      pairCards.sort(() => Math.random() - 0.5);
      renderPairGrid();
      speakText("請翻開卡片，將相同的交通工具配對起來！");
    }

    function renderPairGrid() {
      memoryCardsGrid.innerHTML = '';
      pairCards.forEach((card, index) => {
        const cardEl = document.createElement('button');
        cardEl.className = `card-bg h-36 md:h-44 rounded-2xl border-4 ${card.isMatched ? 'border-emerald-400 bg-emerald-50 opacity-60' : 'border-slate-300 bg-white'} p-2 shadow-md flex items-center justify-center card-hover transition-all relative cursor-pointer`;
        
        if (card.isFlipped || card.isMatched) {
          if (card.type === 'image') {
            cardEl.innerHTML = `
              <div class="w-full h-full rounded-xl overflow-hidden flex items-center justify-center bg-slate-100">
                <img src="${card.img}" referrerpolicy="no-referrer" alt="${card.name}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='${card.fallbackImg}';">
              </div>
            `;
          } else {
            cardEl.innerHTML = `
              <div class="w-full h-full rounded-xl flex flex-col items-center justify-center p-2 text-center bg-amber-100 text-amber-900 font-black">
                <span class="text-2xl md:text-3xl">${card.name}</span>
                <span class="text-xs font-bold text-amber-700 mt-1">字卡</span>
              </div>
            `;
          }
        } else {
          cardEl.innerHTML = `
            <div class="w-full h-full bg-teal-600 rounded-xl flex flex-col items-center justify-center text-white gap-2">
              <i class="fa-solid fa-question text-4xl"></i>
              <span class="text-xs font-bold">點擊翻開</span>
            </div>
          `;
        }

        cardEl.addEventListener('click', () => handlePairCardClick(index));
        memoryCardsGrid.appendChild(cardEl);
      });
    }

    function handlePairCardClick(index) {
      const card = pairCards[index];
      if (card.isFlipped || card.isMatched || flippedCards.length >= 2) return;

      card.isFlipped = true;
      flippedCards.push({ card, index });
      speakText(card.name);
      renderPairGrid();

      if (flippedCards.length === 2) {
        const [first, second] = flippedCards;
        if (first.card.id === second.card.id) {
          AudioEngine.playSuccess();
          first.card.isMatched = true;
          second.card.isMatched = true;
          matchedPairsCount++;
          pairMatchScore.textContent = matchedPairsCount;
          flippedCards = [];
          
          if (matchedPairsCount === TRANSPORTS.length) {
            setTimeout(() => {
              confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } });
              speakText("恭喜你！完成所有交通工具配對！");
            }, 500);
          }
        } else {
          AudioEngine.playTryAgain();
          setTimeout(() => {
            first.card.isFlipped = false;
            second.card.isFlipped = false;
            flippedCards = [];
            renderPairGrid();
          }, 1200);
        }
      }
    }

    function setupEventListeners() {
      modeFindBtn.addEventListener('click', () => {
        currentMode = 'find';
        modeFindBtn.className = "flex-1 max-w-xs py-3 px-6 bg-indigo-600 text-white font-extrabold text-xl rounded-2xl shadow-lg border-b-4 border-indigo-800 hover:bg-indigo-500 flex items-center justify-center gap-2";
        modePairBtn.className = "flex-1 max-w-xs py-3 px-6 bg-slate-300 text-slate-700 font-extrabold text-xl rounded-2xl shadow-md border-b-4 border-slate-400 hover:bg-slate-200 flex items-center justify-center gap-2";
        findModeSection.classList.remove('hidden');
        pairModeSection.classList.add('hidden');
        initFindMode();
      });

      modePairBtn.addEventListener('click', () => {
        currentMode = 'pair';
        modePairBtn.className = "flex-1 max-w-xs py-3 px-6 bg-indigo-600 text-white font-extrabold text-xl rounded-2xl shadow-lg border-b-4 border-indigo-800 hover:bg-indigo-500 flex items-center justify-center gap-2";
        modeFindBtn.className = "flex-1 max-w-xs py-3 px-6 bg-slate-300 text-slate-700 font-extrabold text-xl rounded-2xl shadow-md border-b-4 border-slate-400 hover:bg-slate-200 flex items-center justify-center gap-2";
        findModeSection.classList.add('hidden');
        pairModeSection.classList.remove('hidden');
        initPairMode();
      });

      speakTargetBtn.addEventListener('click', () => {
        if (currentTargetItem) speakText(`請找出，${currentTargetItem.name}`);
      });

      repeatAudioBtn.addEventListener('click', () => {
        if (currentMode === 'find' && currentTargetItem) {
          speakText(`請找出，${currentTargetItem.name}`);
        } else {
          speakText("請點擊卡片進行交通工具配對");
        }
      });

      contrastBtn.addEventListener('click', () => {
        highContrastMode = !highContrastMode;
        document.body.classList.toggle('high-contrast', highContrastMode);
        contrastBtn.classList.toggle('bg-white', highContrastMode);
        contrastBtn.classList.toggle('text-black', highContrastMode);
      });

      nextQuestionBtn.addEventListener('click', () => {
        successModal.classList.add('hidden');
        initFindMode();
      });

      resetPairGameBtn.addEventListener('click', () => {
        initPairMode();
      });
    }
  </script>
</body>
</html>
